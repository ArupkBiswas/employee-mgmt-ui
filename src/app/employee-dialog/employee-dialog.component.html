<h2 mat-dialog-title class="dialog-title">Add New Employee</h2>

<form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="dialog-form">
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <!-- <mat-form-field appearance="outline">
      <mat-label>Joining Date</mat-label>
      <input matInput formControlName="joiningDate" type="date" />
    </mat-form-field> -->

    <mat-form-field appearance="outline">
      <mat-label>Joining date</mat-label>
      <input matInput [matDatepicker]="picker">
      <mat-hint>MM/DD/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Job ID</mat-label>
      <input matInput formControlName="jobId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Salary</mat-label>
      <input matInput type="number" formControlName="salary" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Commission %</mat-label>
      <input matInput type="number" formControlName="commissionPct" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Manager ID</mat-label>
      <input matInput formControlName="managerId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Department ID</mat-label>
      <input matInput formControlName="departmentId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Role</mat-label>
      <mat-select formControlName="role">
        @for (role of roles; track role) {
          <mat-option [value]="role.value">{{role.viewValue}}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Need to change the logic later -->
    <!-- Password -->
    <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>

        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />

        <button
          mat-icon-button
          matSuffix
          type="button"
          aria-label="Toggle password visibility"
          (click)="hidePassword = !hidePassword"
        >
          <mat-icon>
            {{ hidePassword ? 'visibility_off' : 'visibility' }}
          </mat-icon>
        </button>

        <mat-error *ngIf="
          employeeForm.get('password')?.hasError('required') &&
          employeeForm.get('password')?.touched
        ">
          Password is required
        </mat-error>
    </mat-form-field>
    

  </div>

  <div mat-dialog-actions align="end" class="actions">
    <button mat-stroked-button color="warn" type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Add</button>
  </div>
</form>
