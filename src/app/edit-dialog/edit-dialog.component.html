<h2 mat-dialog-title class="dialog-title">Add New Employee</h2>

<form [formGroup]="employeeForm" (ngSubmit)="onSubmit(employeeForm.value)" class="dialog-form">
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>First Name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Joining Date</mat-label>
      <input matInput formControlName="joiningDate" type="date" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Job ID</mat-label>
      <input matInput formControlName="jobId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Salary</mat-label>
      <input matInput type="number" formControlName="salary" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Commission %</mat-label>
      <input matInput type="number" formControlName="commissionPct" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Manager ID</mat-label>
      <input matInput formControlName="managerId" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Department ID</mat-label>
      <input matInput formControlName="departmentId" />
    </mat-form-field>
  </div>

  <div mat-dialog-actions align="end" class="actions">
    <button mat-stroked-button color="warn" type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Edit</button>
  </div>
</form>
