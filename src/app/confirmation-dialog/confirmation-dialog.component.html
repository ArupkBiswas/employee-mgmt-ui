<h2 mat-dialog-title class="dialog-title">Confirmation</h2>
<div class="dialog-container">
    <div mat-dialog-content class="dialog-message">
        <p>{{data.message}}</p>
    </div>
    <div mat-dialog-actions>
        <button mat-button (click)="onCancel()">Cancel</button>
        <button mat-stroked-button color="warn" (click)="onConfirm(data.employeeId)">Delete</button>
    </div>
</div>
